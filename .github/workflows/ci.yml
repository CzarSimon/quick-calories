name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (typecheck, lint, unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      # Resolve Expo versions locally instead of asking Expo's API.
      EXPO_OFFLINE: '1'
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci

  backend:
    name: Backend (access rules on PocketBase 0.40.4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Downloads the pinned PocketBase, builds a throwaway database from backend/pb_migrations
      # and checks isolation, ownership, sessions, the dev seed and migration rollback.
      - run: npm run test:backend
